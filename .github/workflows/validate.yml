
name: Print & Pulse Sicherheitspruefung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Code und Sicherheit pruefen
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python-Code pruefen
        run: python -m py_compile print_pulse_druckplaner/app.py

      - name: Private Daten suchen
        run: python scripts/check_public.py

      - name: Funktionstests ausfuehren
        run: python -m unittest discover -s tests -v
