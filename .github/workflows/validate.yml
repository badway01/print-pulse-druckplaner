
name: Print & Pulse Sicherheitspruefung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Code und Sicherheit pruefen
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python-Code pruefen
        run: |
          python -m py_compile print_pulse_druckplaner/app.py print_pulse_druckplaner/local_orders.py print_pulse_druckplaner/local_order_pdf.py print_pulse_druckplaner/economics.py print_pulse_druckplaner/filament_planner.py print_pulse_druckplaner/filament_purchases.py
          python -m pip install 'reportlab>=3.6,<6' 'pillow>=10,<13'

      - name: JavaScript auf Syntax prüfen
        run: |
          node --check print_pulse_druckplaner/web/filament-planner-ui.js
          node --check print_pulse_druckplaner/web/filament-purchases-ui.js
          node --check print_pulse_druckplaner/web/app.js
          node --check print_pulse_druckplaner/web/components-ui.js
          node --check print_pulse_druckplaner/web/priority-ui.js
          node --check print_pulse_druckplaner/web/economics-ui.js
          node --check print_pulse_druckplaner/web/local-orders-ui.js
          node --check print_pulse_druckplaner/web/dialog-behavior.js
          node --check print_pulse_druckplaner/web/order-zoom-ui.js
          node --check print_pulse_druckplaner/web/stock-orders-ui.js
          node --check tests/stock_orders_ui.cjs
          node --check tests/dialog_ui.cjs
          node --check print_pulse_druckplaner/web/import-ui.js
          node --check tests/ui.cjs
          node --check tests/ui_safari.cjs
          node --check tests/local_ui.cjs
          node --check tests/filament_purchases_ui.cjs
          node --check tests/master_picker_ui.cjs
          node --check tests/order_part_master_ui.cjs
          node --check tests/order_existing_master_ui.cjs
          bash -n print_pulse_druckplaner/web/install-slicer-helper-mac.command

      - name: Private Daten suchen
        run: python scripts/check_public.py

      - name: Funktionstests ausfuehren
        run: python -m unittest discover -s tests -v

      - name: Browser für Bedienprüfung installieren
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          npx playwright install --with-deps chromium webkit

      - name: Oberfläche auf Desktop und Handy prüfen
        run: |
          python tests/preview.py &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/api/status >/dev/null; then break; fi
            sleep 1
          done
          node tests/dialog_ui.cjs
          node tests/stock_orders_ui.cjs
          node tests/master_picker_ui.cjs
          node tests/order_part_master_ui.cjs
          node tests/order_existing_master_ui.cjs
          node tests/ui.cjs
          node tests/ui_safari.cjs
          node tests/local_ui.cjs
          node tests/filament_purchases_ui.cjs

      - name: Ansichten der Bedienprüfung
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lager-v01-ui
          path: /tmp/lager-*.png
          if-no-files-found: ignore
